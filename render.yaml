services:
  - type: web
    name: skysail-ops
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLEPPEY_PASSWORD
        sync: false
      - key: BANGALORE_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
